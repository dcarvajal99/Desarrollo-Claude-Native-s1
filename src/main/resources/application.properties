spring.application.name=Desarrollo-Claude-Native-s1

# --- Datasource H2 (memoria) ---
spring.datasource.url=jdbc:h2:mem:inscripciones;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web H2 en /h2-console (JDBC URL: jdbc:h2:mem:inscripciones, user: sa, sin pass)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# data.sql corre DESPUES de que Hibernate crea el esquema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Desarrollo-Claude-Native-s1
info.app.description=Sistema de inscripcion a cursos - Semana 1 CDY2204
info.app.version=1.0.0

# --- Jackson (serializacion JSON) ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.default-property-inclusion=non_null

# --- Logging ---
logging.level.com.duoc.inscripciones=DEBUG
